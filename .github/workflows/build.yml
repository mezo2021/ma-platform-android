name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find and Build Project
      run: |
        BUILD_FILE=$(find . -name "build.gradle" -type f | grep -v "/app/" | head -n 1)
        if [ -z "$BUILD_FILE" ]; then
          echo "Error: build.gradle not found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Building in directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MA_Platform_Android_APK
        path: '**/app/build/outputs/apk/debug/*.apk'
