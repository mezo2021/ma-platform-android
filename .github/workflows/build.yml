name: Unzip and Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Unzip Project Archive
      run: |
        unzip -o MA_Platform_Android_Project.zip

    - name: Build APK Dynamic Directory
      run: |
        BUILD_FILE=$(find . -name "build.gradle" -type f | grep -v "/app/" | head -n 1)
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Found project in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MA_Platform_Android_APK
        path: '**/app/build/outputs/apk/debug/*.apk'
