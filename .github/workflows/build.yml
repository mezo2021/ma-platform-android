- name: Verify Keystore
  run: |
    echo "=== محتوى المجلد ==="
    ls -la app/*.jks
    echo "=== حجم الملف ==="
    wc -c app/ma-platform-key.jks
    echo "=== محاولة قراءة Keystore ==="
    keytool -list -keystore app/ma-platform-key.jks \
      -storepass "M.A@2026#Key" 2>&1 | head -20

- name: Build Signed Release APK
name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
          log-accepted-android-sdk-licenses: false

      - name: Install Gradle 8.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip -O /tmp/gradle.zip
          sudo unzip -q -d /opt/gradle /tmp/gradle.zip
          sudo chmod +x /opt/gradle/gradle-8.1/bin/gradle
          echo "/opt/gradle/gradle-8.1/bin" >> $GITHUB_PATH

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/ma-platform-key.jks
          ls -la app/ma-platform-key.jks

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload Signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MA-Platform-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -f app/ma-platform-key.jks
