name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
          log-accepted-android-sdk-licenses: false

      - name: Install Gradle 8.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip -O /tmp/gradle.zip
          sudo unzip -q -d /opt/gradle /tmp/gradle.zip
          sudo chmod +x /opt/gradle/gradle-8.1/bin/gradle
          echo "/opt/gradle/gradle-8.1/bin" >> $GITHUB_PATH

      - name: Setup App Icon
        run: |
          mkdir -p app/src/main/res/drawable
          if [ -f play_store_512.png ]; then
            cp play_store_512.png app/src/main/res/drawable/ic_launcher.png
          elif [ -f icon.png ]; then
            cp icon.png app/src/main/res/drawable/ic_launcher.png
          elif [ -f ic_launcher.png ]; then
            cp ic_launcher.png app/src/main/res/drawable/ic_launcher.png
          else
            echo "⚠️ لم يتم العثور على أي أيقونة في الجذر — سيتم المتابعة بدون أيقونة مخصصة"
          fi
          ls -la app/src/main/res/drawable/ || true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/ma-platform-key.jks
          ls -la app/ma-platform-key.jks

      - name: Verify Keystore
        run: |
          wc -c app/ma-platform-key.jks
          keytool -list -keystore app/ma-platform-key.jks -storepass "M.A@2026#Key" 2>&1 | head -20

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload Signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MA-Platform-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -f app/ma-platform-key.jks
