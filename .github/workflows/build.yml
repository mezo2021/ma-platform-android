name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle Wrapper Files
        run: |
          mkdir -p gradle/wrapper

          # 1) تحميل gradlew إن لم يكن موجوداً
          if [ ! -f gradlew ]; then
            curl -sL -o gradlew "https://github.com/gradle/gradle/raw/v8.1.0/gradlew"
          fi
          chmod +x gradlew

          # 2) تحميل gradlew.bat إن لم يكن موجوداً
          if [ ! -f gradlew.bat ]; then
            curl -sL -o gradlew.bat "https://github.com/gradle/gradle/raw/v8.1.0/gradlew.bat"
          fi

          # 3) تحميل gradle-wrapper.jar إن لم يكن موجوداً
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://github.com/gradle/gradle/raw/v8.1.0/gradle/wrapper/gradle-wrapper.jar"
          fi

          # 4) إنشاء gradle-wrapper.properties إن لم يكن موجوداً
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.1-bin.zip
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          fi

          echo "✅ Gradle Wrapper ready:"
          ls -la gradlew gradle/wrapper/

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MA-Platform-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn
