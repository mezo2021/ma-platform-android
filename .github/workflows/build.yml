‏name: Build APK
‏
‏on:
‏  workflow_dispatch:
‏  push:
‏    branches: [ main, master ]
‏
‏jobs:
‏  build:
‏    runs-on: ubuntu-latest
‏
‏    steps:
‏      - name: Checkout
‏        uses: actions/checkout@v4
‏
‏      - name: Set up JDK 17
‏        uses: actions/setup-java@v4
‏        with:
‏          distribution: 'temurin'
‏          java-version: '17'
‏
‏      - name: Setup Android SDK
‏        uses: android-actions/setup-android@v4
‏        with:
‏          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
‏          log-accepted-android-sdk-licenses: false
‏
‏      - name: Install Gradle 8.1
‏        run: |
‏          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip -O /tmp/gradle.zip
‏          sudo unzip -q -d /opt/gradle /tmp/gradle.zip
‏          sudo chmod +x /opt/gradle/gradle-8.1/bin/gradle
‏          echo "/opt/gradle/gradle-8.1/bin" >> $GITHUB_PATH
‏
‏      - name: Build APK
‏        run: gradle assembleDebug --stacktrace --no-daemon
‏
‏      - name: Upload APK
‏        if: success()
‏        uses: actions/upload-artifact@v4
‏        with:
‏          name: MA-Platform-APK
‏          path: app/build/outputs/apk/debug/app-debug.apk
