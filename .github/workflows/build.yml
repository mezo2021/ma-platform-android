name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Unzip, Fix Permissions and Build
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE"
        fi

        # منح صلاحيات القراءة والكتابة والتنفيذ لجميع الملفات والمجلدات المفكوكة
        chmod -R 777 .

        TARGET_DIR=$(dirname $(find . -name "build.gradle" | grep -v "/app/" | head -n 1))
        echo "Building project at: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MA_Platform_Android_APK
        path: '**/app/build/outputs/apk/debug/*.apk'
