name: Debug Unzip and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Unzip and Build
      run: |
        unzip -o MA_Platform_Android_Project.zip
        echo "--- Listing Directory Content ---"
        ls -la
        
        # البحث عن ملف build.gradle المباشر وتحديد مجلده
        TARGET_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
        echo "Target directory is: $TARGET_DIR"
        
        cd "$TARGET_DIR"
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MA_Platform_Android_APK
        path: '**/app/build/outputs/apk/debug/*.apk'
