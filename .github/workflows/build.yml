name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          echo "=========== نهاية البناء ==========="

      - name: Show Errors Only
        if: failure()
        run: |
          echo "===== رسائل الأخطاء ====="
          grep -i "error\|exception\|cannot\|failed" build.log | head -50

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MA-Platform-APK
          path: app/build/outputs/apk/debug/app-debug.apk
