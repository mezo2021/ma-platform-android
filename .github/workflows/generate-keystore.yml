name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        run: |
          mkdir -p keystore-output
          keytool -genkeypair -v \
            -keystore keystore-output/ma-platform-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ma-platform-key \
            -storepass M.A@2026#Key \
            -keypass M.A@2026#Key \
            -dname "CN=Mustafa Ali Akr, OU=M.A Platform, O=M.A Training, L=Damascus, ST=Damascus, C=SY"
          echo "✅ تم إنشاء Keystore"
          ls -la keystore-output/

      - name: Convert to Base64
        run: |
          base64 -w 0 keystore-output/ma-platform-key.jks > keystore-output/keystore-base64.txt
          echo "طول Base64:"
          wc -c keystore-output/keystore-base64.txt

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: keystore-output/
          retention-days: 1
